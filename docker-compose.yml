# Optional local PostgreSQL for development
# Usage: docker compose up -d

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: personal-ai-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: personal_ai_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_ai_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
